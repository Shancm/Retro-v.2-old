name: Retro OS ISO build
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static verification
        run: |
          chmod +x scripts/*.sh stages/**/*.sh 2>/dev/null || true
          bash scripts/verify.sh || true

      - name: Build Real Hybrid ISO
        run: |
          chmod +x scripts/build.sh
          sudo bash scripts/build.sh

      - name: Upload ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: retro-os-noble-amd64
          path: |
            out/*.iso
            out/*.sha256
          if-no-files-found: error
          retention-days: 14
