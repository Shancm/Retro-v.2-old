name: Retro OS ISO build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'stages/**'
      - 'rootfs/**'
      - 'scripts/**'
      - '.github/workflows/build-iso.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap xorriso squashfs-tools \
            grub-pc-bin grub-efi-amd64-bin grub-efi-amd64-signed shim-signed
      - name: Static verification
        run: bash scripts/verify.sh
      - name: Build ISO
        run: sudo --preserve-env=GITHUB_WORKSPACE bash scripts/build.sh
      - name: Normalize output permissions
        if: always()
        run: sudo chown -R "$USER":"$USER" out .build-work 2>/dev/null || true
      - name: Upload ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: retro-os-noble-amd64
          path: |
            out/*.iso
            out/*.sha256
          if-no-files-found: error
          retention-days: 14
