name: Build Retro OS v2.0 ISO

on:
  workflow_dispatch:
    inputs:
      debian_suite:
        description: "Debian suite to build against"
        required: false
        default: "bookworm"
        type: choice
        options: [bookworm, trixie]
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "overlay/**"
      - "config.env"
      - "build.sh"
      - ".github/workflows/build-iso.yml"

concurrency:
  group: retro-os-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build hybrid BIOS/UEFI ISO
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    # റിലീസ് അപ്‌ലോഡ് ചെയ്യാൻ ഈ പെർമിഷൻ നിർബന്ധമാണ്
    permissions:
      contents: write

    container:
      image: debian:bookworm
      options: --privileged
      
    defaults:
      run:
        shell: bash
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            debootstrap squashfs-tools xorriso isolinux syslinux-common \
            syslinux-utils grub-pc-bin grub-efi-amd64-bin grub-efi-amd64-signed \
            mtools dosfstools zstd ca-certificates sudo binutils \
            git curl wget python3

      - name: Override Debian suite (manual dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          sed -i "s/^export DEBIAN_SUITE=.*/export DEBIAN_SUITE=\"${{ inputs.debian_suite }}\"/" config.env

      - name: Make scripts and overlays executable
        run: |
          chmod +x build.sh scripts/*.sh
          [ -f overlay/usr/local/bin/retro ] && chmod +x overlay/usr/local/bin/retro
          [ -f overlay/opt/retro-ai/retro_ai.py ] && chmod +x overlay/opt/retro-ai/retro_ai.py || true

      - name: Run Retro OS build
        run: |
          ./build.sh --bootstrap-host --clean
        env:
          BUILD_ROOT: ${{ github.workspace }}/build
          
      - name: Verify artifact
        run: |
          set -Eeuo pipefail
          ls -lh build/out/
          (cd build/out && sha256sum -c ./*.sha256)

      - name: Release and Upload ISO
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "v2.0-build-${{ github.run_number }}"
          name: "Retro OS v2.0 (Build #${{ github.run_number }})"
          body: "Automated production build of Retro OS v2.0 Hybrid ISO with SHA-256 checksums."
          files: |
            build/out/*.iso
            build/out/*.sha256
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retro-os-v2-build-logs
          path: |
            build/logs/*.log
            build/chroot/var/log/retro-os/*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          {
            echo "## Retro OS v2.0 build summary"
            echo
            if ls build/out/*.iso >/dev/null 2>&1; then
              echo "✅ ISO built successfully"
              echo
              echo '```'
              ls -lh build/out/
              echo '```'
              echo
              echo "SHA-256:"
              echo '```'
              cat build/out/*.sha256
              echo '```'
            else
              echo "❌ Build failed — inspect the action log or download the build-logs artifact"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
