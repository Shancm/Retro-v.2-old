---
name: Build and test Retro OS v2.0

'on':
  workflow_dispatch:
    inputs:
      debian_suite:
        description: Debian suite to build against
        required: false
        default: trixie
        type: choice
        options: [trixie]
  push:
    paths:
      - "build.sh"
      - "config.env"
      - "test_iso.sh"
      - "scripts/**"
      - "overlay/**"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "build.sh"
      - "config.env"
      - "test_iso.sh"
      - "scripts/**"
      - "overlay/**"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/**"

concurrency:
  group: retro-os-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_ROOT: /opt/retro-build
  DEBIAN_FRONTEND: noninteractive

permissions:
  contents: read

jobs:
  quality:
    name: Static checks and unit tests
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install quality tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            shellcheck yamllint python3 python3-venv curl
      - name: Check executable scripts
        run: |
          set -Eeuo pipefail
          chmod +x build.sh test_iso.sh scripts/*.sh
          if [[ -f overlay/usr/local/bin/retro ]]; then
            chmod +x overlay/usr/local/bin/retro
          fi
          if [[ -f overlay/opt/retro-ai/retro_ai.py ]]; then
            chmod +x overlay/opt/retro-ai/retro_ai.py
          fi
          test -x build.sh
          test -x test_iso.sh
          for f in scripts/*.sh; do test -x "$f"; done
          if [[ -f overlay/usr/local/bin/retro ]]; then
            test -x overlay/usr/local/bin/retro
          fi
          if [[ -f overlay/opt/retro-ai/retro_ai.py ]]; then
            test -x overlay/opt/retro-ai/retro_ai.py
          fi
      - name: Bash syntax
        run: |
          set -Eeuo pipefail
          bash -n build.sh config.env test_iso.sh scripts/*.sh
          bash -n overlay/usr/local/bin/retro
          bash -n overlay/usr/local/sbin/retro-usb-maker
          bash -n overlay/usr/local/sbin/retro-hardware-report
          bash -n overlay/usr/local/sbin/retro-boot-report
          bash -n tests/test_retro_usb_maker.sh
      - name: ShellCheck
        run: |
          set -Eeuo pipefail
          shellcheck -x build.sh config.env test_iso.sh scripts/*.sh
          shellcheck -x overlay/usr/local/bin/retro
          shellcheck -x \
            overlay/usr/local/sbin/retro-usb-maker \
            overlay/usr/local/sbin/retro-hardware-report \
            overlay/usr/local/sbin/retro-boot-report
          shellcheck -x \
            tests/test_retro_usb_maker.sh \
            tests/test_retro_hardware_report.sh
      - name: YAML lint
        run: yamllint -s .github/workflows
      - name: Python unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Retro CLI update functional tests
        run: bash tests/test_retro_update.sh
      - name: Self-test helper regression tests
        run: bash tests/test_selftest_helpers.sh
      - name: USB persistence provisioner interface tests
        run: bash tests/test_retro_usb_maker.sh
      - name: Modern tool verification helper tests
        run: bash tests/test_retro_tools.sh
      - name: Hardware report interface tests
        run: bash tests/test_retro_hardware_report.sh

  build:
    name: Build hybrid BIOS/UEFI ISO
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 150
    permissions:
      contents: read
    container:
      image: debian:trixie
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Free runner disk space
        run: |
          set -Eeuo pipefail
          apt-get clean
          rm -rf /var/lib/apt/lists/*
          df -h /
      - name: Install host build and QEMU dependencies
        run: |
          set -Eeuo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            debootstrap squashfs-tools xorriso isolinux syslinux-common \
            syslinux-utils grub-common grub-pc-bin grub-efi-amd64-bin \
            grub-efi-amd64-signed mtools dosfstools zstd ca-certificates \
            sudo binutils git curl wget python3 qemu-system-x86 ovmf
      - name: Override Debian suite (manual dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python3 - "${{ inputs.debian_suite }}" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path("config.env")
          content, count = re.subn(
              r"^export DEBIAN_SUITE=.*$",
              f'export DEBIAN_SUITE="{sys.argv[1]}"',
              path.read_text(encoding="utf-8"),
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("could not override DEBIAN_SUITE")
          path.write_text(content, encoding="utf-8")
          PY
      - name: Make scripts executable and verify
        run: |
          set -Eeuo pipefail
          chmod +x build.sh test_iso.sh scripts/*.sh
          if [[ -f overlay/usr/local/bin/retro ]]; then
            chmod +x overlay/usr/local/bin/retro
          fi
          if [[ -f overlay/opt/retro-ai/retro_ai.py ]]; then
            chmod +x overlay/opt/retro-ai/retro_ai.py
          fi
          test -x build.sh
          test -x test_iso.sh
          for f in scripts/*.sh; do test -x "$f"; done
          df -h "$BUILD_ROOT" || true
      - name: Run Retro OS build
        run: ./build.sh --clean
      - name: Verify ISO and checksum from BUILD_ROOT
        run: |
          set -Eeuo pipefail
          test -s "$BUILD_ROOT/out/retro-os-v2.0-amd64.iso"
          test -s "$BUILD_ROOT/out/retro-os-v2.0-amd64.iso.sha256"
          (
            cd "$BUILD_ROOT/out"
            sha256sum --status -c retro-os-v2.0-amd64.iso.sha256
          )
      - name: Upload ISO artifact for firmware matrix
        uses: actions/upload-artifact@v4
        with:
          name: retro-os-v2-iso
          path: |
            /opt/retro-build/out/*.iso
            /opt/retro-build/out/*.sha256
          if-no-files-found: error
          retention-days: 3
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retro-os-v2-build-logs
          path: |
            /opt/retro-build/logs/*.log
            /opt/retro-build/chroot/var/log/retro-os/*.log
          retention-days: 7
          if-no-files-found: ignore

  firmware:
    name: "${{ matrix.firmware }} boot test"
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        firmware: [bios, uefi]
    container:
      image: debian:trixie
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install QEMU and firmware
        run: |
          set -Eeuo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf xorriso python3
      - name: Download built ISO
        uses: actions/download-artifact@v4
        with:
          name: retro-os-v2-iso
          path: /opt/retro-build/out
      - name: Verify downloaded ISO checksum
        run: |
          set -Eeuo pipefail
          (
            cd "$BUILD_ROOT/out"
            sha256sum --status -c retro-os-v2.0-amd64.iso.sha256
          )
      - name: Run ${{ matrix.firmware }} QEMU boot test
        run: |
          set -Eeuo pipefail
          if [[ "${{ matrix.firmware }}" == "bios" ]]; then
            bash ./test_iso.sh --bios --ram-mb 1024 --report --no-kvm --usb \
              --timeout 600 "$BUILD_ROOT/out/retro-os-v2.0-amd64.iso"
          else
            bash ./test_iso.sh --uefi --ram-mb 1024 --report --no-kvm \
              --timeout 600 "$BUILD_ROOT/out/retro-os-v2.0-amd64.iso"
          fi
      - name: Upload firmware test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retro-os-v2-${{ matrix.firmware }}-logs
          path: |
            /opt/retro-build/out/test-logs/**
            test-logs/**
          retention-days: 7
          if-no-files-found: ignore


  report-failure:
    name: Report build failure
    if: >-
      ${{ always() &&
          (needs.quality.result == 'failure' ||
           needs.build.result == 'failure' ||
           needs.firmware.result == 'failure') }}
    needs: [quality, build, firmware]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Summarize failed jobs and open a diagnostic issue
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run ?? {
              id: context.runId,
              run_number: context.runNumber,
              name: context.workflow,
              head_branch: context.ref.replace('refs/heads/', ''),
              head_sha: context.sha,
              html_url: 'https://github.com/' + context.repo.owner + '/' +
                context.repo.repo + '/actions/runs/' + context.runId,
              conclusion: 'failure'
            };
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100
            });
            const failed = data.jobs.filter(job => {
              const bad = ['failure', 'timed_out', 'cancelled',
                'action_required'];
              return bad.includes(job.conclusion);
            });
            const rows = failed.length
              ? failed.map(job =>
                  `- **${job.name}** — ${job.conclusion}; ` +
                  `[view job logs](${job.html_url})`).join('\\n')
              : '- One or more dependent jobs failed; inspect the run summary.';
            const title = 'Retro OS CI failure: run #' + context.runNumber +
              ' (' + context.runId + ')';
            const body = [
              '## Automated build-failure report',
              '',
              `- **Workflow:** ${context.workflow}`,
              `- **Branch:** ${run.head_branch}`,
              `- **Commit:** \`${context.sha}\``,
              `- **Run:** [Open GitHub Actions run](${run.html_url})`,
              '',
              '## Failed jobs',
              rows,
              '',
              '## Required handling',
              'Inspect the first causal error and propose the smallest safe ' +
              'fix. Do not weaken checksum/signature verification, disable ' +
              'tests, hide failures, force-push, or merge PR #8. Do not claim ' +
              'physical hardware tests passed based on CI.',
              '',
              '_Automatically generated. This job reports failures; it does ' +
              'not autonomously modify source code._'
            ].join('\\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });
            const duplicate = existing.data.some(issue => {
              return !issue.pull_request && issue.title === title;
            });
            if (duplicate) {
              core.info('A report for this workflow run already exists.');
              return;
            }
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });
            core.info(`Created failure report: ${issue.data.html_url}`);

  release:
    name: Publish ISO release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build, firmware]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download built ISO
        uses: actions/download-artifact@v4
        with:
          name: retro-os-v2-iso
          path: release-out
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v2.0-build-${{ github.run_number }}"
          name: "Retro OS v2.0 (Build #${{ github.run_number }})"
          body: >-
            Automated Debian-based BIOS/UEFI hybrid ISO
            with SHA-256 checksum.
          files: |
            release-out/*.iso
            release-out/*.sha256
          token: ${{ secrets.GITHUB_TOKEN }}
