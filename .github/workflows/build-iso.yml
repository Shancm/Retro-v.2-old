name: Build and test Retro OS v2.0

on:
  workflow_dispatch:
    inputs:
      debian_suite:
        description: Debian suite to build against
        required: false
        default: bookworm
        type: choice
        options: [bookworm, trixie]
  push:
    paths:
      - "build.sh"
      - "config.env"
      - "test_iso.sh"
      - "scripts/**"
      - "overlay/**"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "build.sh"
      - "config.env"
      - "test_iso.sh"
      - "scripts/**"
      - "overlay/**"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/**"

concurrency:
  group: retro-os-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_ROOT: /opt/retro-build
  DEBIAN_FRONTEND: noninteractive

jobs:
  quality:
    name: Static checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /opt/ghc
          sudo apt-get clean
          df -h /
      - name: Install quality tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck yamllint python3 python3-venv
      - name: Check executable scripts
        run: |
          set -Eeuo pipefail
          chmod +x build.sh test_iso.sh scripts/*.sh
          [[ ! -f overlay/usr/local/bin/retro ]] || chmod +x overlay/usr/local/bin/retro
          [[ ! -f overlay/opt/retro-ai/retro_ai.py ]] || chmod +x overlay/opt/retro-ai/retro_ai.py
          test -x build.sh
          test -x test_iso.sh
          for f in scripts/*.sh; do test -x "$f"; done
          [[ ! -f overlay/usr/local/bin/retro ]] || test -x overlay/usr/local/bin/retro
          [[ ! -f overlay/opt/retro-ai/retro_ai.py ]] || test -x overlay/opt/retro-ai/retro_ai.py
      - name: Bash syntax
        run: bash -n build.sh test_iso.sh scripts/*.sh overlay/usr/local/bin/retro
      - name: ShellCheck
        run: shellcheck -x build.sh test_iso.sh scripts/*.sh overlay/usr/local/bin/retro
      - name: YAML lint
        run: yamllint -s .github/workflows
      - name: Python unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Retro CLI update functional tests
        run: bash tests/test_retro_update.sh

  build:
    name: Build hybrid BIOS/UEFI ISO
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 150
    permissions:
      contents: write
    container:
      image: debian:bookworm
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Free runner disk space
        run: |
          set -Eeuo pipefail
          apt-get clean
          rm -rf /var/lib/apt/lists/*
          df -h /
      - name: Install host build and QEMU dependencies
        run: |
          set -Eeuo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            debootstrap squashfs-tools xorriso isolinux syslinux-common \
            syslinux-utils grub-common grub-pc-bin grub-efi-amd64-bin \
            grub-efi-amd64-signed mtools dosfstools zstd ca-certificates \
            sudo binutils git curl wget python3 qemu-system-x86 ovmf
      - name: Override Debian suite (manual dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          sed -i "s/^export DEBIAN_SUITE=.*/export DEBIAN_SUITE=\"${{ inputs.debian_suite }}\"/" config.env
      - name: Make scripts executable and verify
        run: |
          set -Eeuo pipefail
          chmod +x build.sh test_iso.sh scripts/*.sh
          [[ ! -f overlay/usr/local/bin/retro ]] || chmod +x overlay/usr/local/bin/retro
          [[ ! -f overlay/opt/retro-ai/retro_ai.py ]] || chmod +x overlay/opt/retro-ai/retro_ai.py
          test -x build.sh
          test -x test_iso.sh
          for f in scripts/*.sh; do test -x "$f"; done
          df -h "$BUILD_ROOT" || true
      - name: Run Retro OS build
        run: ./build.sh --clean
      - name: Verify ISO and checksum from BUILD_ROOT
        run: |
          set -Eeuo pipefail
          test -s "$BUILD_ROOT/out/retro-os-v2.0-amd64.iso"
          test -s "$BUILD_ROOT/out/retro-os-v2.0-amd64.iso.sha256"
          (cd "$BUILD_ROOT/out" && sha256sum --status -c retro-os-v2.0-amd64.iso.sha256)
      - name: Upload ISO artifact for firmware matrix
        uses: actions/upload-artifact@v4
        with:
          name: retro-os-v2-iso
          path: |
            /opt/retro-build/out/*.iso
            /opt/retro-build/out/*.sha256
          if-no-files-found: error
          retention-days: 3
      - name: Release and upload ISO
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v2.0-build-${{ github.run_number }}"
          name: "Retro OS v2.0 (Build #${{ github.run_number }})"
          body: "Automated Debian-based BIOS/UEFI hybrid ISO with SHA-256 checksum."
          files: |
            /opt/retro-build/out/*.iso
            /opt/retro-build/out/*.sha256
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retro-os-v2-build-logs
          path: |
            /opt/retro-build/logs/*.log
            /opt/retro-build/chroot/var/log/retro-os/*.log
          retention-days: 7
          if-no-files-found: ignore

  firmware:
    name: "${{ matrix.firmware }} boot test"
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        firmware: [bios, uefi]
    container:
      image: debian:bookworm
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install QEMU and firmware
        run: |
          set -Eeuo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends qemu-system-x86 ovmf xorriso python3
      - name: Download built ISO
        uses: actions/download-artifact@v4
        with:
          name: retro-os-v2-iso
          path: /opt/retro-build/out
      - name: Verify downloaded ISO checksum
        run: |
          set -Eeuo pipefail
          (cd "$BUILD_ROOT/out" && sha256sum --status -c retro-os-v2.0-amd64.iso.sha256)
      - name: Run ${{ matrix.firmware }} QEMU boot test
        run: |
          set -Eeuo pipefail
          if [[ "${{ matrix.firmware }}" == "bios" ]]; then
            ./test_iso.sh --bios --report --no-kvm --timeout 600 "$BUILD_ROOT/out/retro-os-v2.0-amd64.iso"
          else
            ./test_iso.sh --uefi --report --no-kvm --timeout 600 "$BUILD_ROOT/out/retro-os-v2.0-amd64.iso"
          fi
      - name: Upload firmware test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retro-os-v2-${{ matrix.firmware }}-logs
          path: |
            /opt/retro-build/out/test-logs/**
            test-logs/**
          retention-days: 7
          if-no-files-found: ignore
