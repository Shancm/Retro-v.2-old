name: Retro OS ISO build
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso squashfs-tools genisoimage wget curl

      - name: Create Dummy ISO for Testing Artifact Upload
        run: |
          mkdir -p out
          echo "Retro OS v2.0 Ultra-Light ISO Build Placeholder" > out/retro-os-noble-amd64.iso
          sha256sum out/retro-os-noble-amd64.iso > out/retro-os-noble-amd64.iso.sha256

      - name: Upload ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: retro-os-noble-amd64
          path: |
            out/*.iso
            out/*.sha256
          if-no-files-found: error
          retention-days: 14
