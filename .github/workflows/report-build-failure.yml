name: Report Retro OS build failures

'on':
  workflow_run:
    workflows:
      - Build and test Retro OS v2.0
    types:
      - completed
    branches:
      - audit/boot-build-fixes

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: retro-os-failure-report-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  report-failure:
    name: Create failure report
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' || github.event.workflow_run.conclusion == 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Summarize failed jobs and open a diagnostic issue
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100
            });

            const failed = data.jobs.filter(job =>
              ['failure', 'timed_out', 'cancelled', 'action_required'].includes(job.conclusion)
            );

            const rows = failed.length
              ? failed.map(job =>
                  `- **${job.name}** — ${job.conclusion}; [view job logs](${job.html_url})`
                ).join('\n')
              : '- GitHub reported a failed/cancelled run, but no failed job was returned.';

            const title = `Retro OS CI ${run.conclusion}: run #${run.run_number} (${run.id})`;
            const body = [
              '## Automated build-failure report',
              '',
              `- **Workflow:** ${run.name}`,
              `- **Branch:** ${run.head_branch}`,
              `- **Commit:** \`${run.head_sha}\``,
              `- **Conclusion:** ${run.conclusion}`,
              `- **Run:** [Open GitHub Actions run](${run.html_url})`,
              '',
              '## Failed jobs',
              rows,
              '',
              '## Next step',
              'Inspect the linked job logs, identify the first causal error, and propose the smallest safe fix. Do not weaken checksum/signature verification, disable tests, hide failures, force-push, or merge PR #8. Do not claim physical hardware tests passed based on CI.',
              '',
              '_This issue was generated automatically by the failure-report workflow. It does not perform autonomous code changes._'
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });
            const duplicate = existing.data.find(issue =>
              !issue.pull_request && issue.title === title
            );

            if (duplicate) {
              core.info(`Failure report already exists: ${duplicate.html_url}`);
              return;
            }

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });
            core.info(`Created failure report: ${issue.data.html_url}`);
